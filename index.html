<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa um 1900</title>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- PapaParse für CSV-Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background-color: #f4f1ea;
        }

        /* Basemap stummschalten */
        .leaflet-tile-container {
            filter: grayscale(100%) opacity(0.35) contrast(70%) brightness(110%);
        }

        .leaflet-tile {
            transition: opacity 0.2s linear;
        }

        /* Tooltip Resets */
        .leaflet-tooltip,
        .leaflet-tooltip-pane .leaflet-tooltip {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .leaflet-tooltip-pane .leaflet-tooltip::before {
            display: none !important;
        }

        /* Base Label Styles */
        .city-label, 
        .city-label-special, 
        .empire-label {
            transition: text-shadow 0.2s ease;
            white-space: nowrap;
        }

        /* Städtenamen */
        .city-label {
            font-weight: 500;
            font-size: 11px;
            color: #222222 !important;
            text-shadow: 1px 1px 2px #ffffff, -1px -1px 2px #ffffff, 0 0 4px #ffffff;
        }

        .city-label-special {
            font-weight: 700;
            font-size: 12px;
            color: #000000 !important;
            letter-spacing: 0.2px;
            text-shadow: 1px 1px 3px #ffffff, -1px -1px 3px #ffffff, 0 0 5px #ffffff;
        }

        /* Imperien-Labels (KURSIV) */
        .empire-label {
            font-size: 13px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #2c3e50;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.95), -1px -1px 3px rgba(255, 255, 255, 0.95);
            pointer-events: none;
        }

        /* Text-Halo bei Eisenbahn-Netz */
        .city-label.active-railway-bg {
            text-shadow: 0 0 4px #ffffff, 0 0 4px #ffffff, 1px 1px 2px #ffffff, -1px -1px 2px #ffffff !important;
        }

        .city-label-special.active-railway-bg {
            text-shadow: 0 0 6px #ffffff, 0 0 6px #ffffff, 2px 2px 3px #ffffff, -2px -2px 3px #ffffff !important;
        }

                /* Ruhiger, weicher Halo für die Imperien-Labels bei aktivierter Eisenbahn */
        .empire-label.active-railway-bg {
            text-shadow: 0 0 6px #f4f1ea, 0 0 10px #f4f1ea !important;
        }

        /* Regionalbeschriftungen */
        .region-label-auto {
            font-size: 10.5px;
            font-weight: 600;
            color: rgba(40, 50, 60, 0.75);
            text-transform: none;
            letter-spacing: 0.3px;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9), -1px -1px 2px rgba(255, 255, 255, 0.9);
        }

        .region-label-poland {
            font-size: 11px;
            font-weight: 700;
            color: rgba(30, 40, 50, 0.85);
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 1px 1px 3px #ffffff, -1px -1px 3px #ffffff;
        }

        /* Layer-Control Styling */
        .leaflet-control-layers {
            border-radius: 6px !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2) !important;
            font-size: 12px;
            font-weight: 600;
            color: #2c3e50;
            padding: 4px 8px !important;
        }

        /* In deinem CSS für Karten-Labels / Marker-Texte: */
        .leaflet-tooltip, .map-label {
            text-shadow: 
                2px  2px 0px #fdfbf7,
               -2px -2px 0px #fdfbf7,
                2px -2px 0px #fdfbf7,
               -2px  2px 0px #fdfbf7,
                0px  2px 0px #fdfbf7,
                0px -2px 0px #fdfbf7;
        }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
 // 1. Karte initialisieren
    const map = L.map('map', {
        zoomSnap: 0.25,
        zoomDelta: 0.5,
        wheelDebounceTime: 40,
        wheelPxPerZoomLevel: 120
    }).setView([51.8, 19.5], 6);

    // 2. Panes & Layer-Gruppen
    map.createPane('empiresPane');
    map.getPane('empiresPane').style.zIndex = 300;

    map.createPane('subbordersPane');
    map.getPane('subbordersPane').style.zIndex = 350;

    map.createPane('railwaysPane');
    map.getPane('railwaysPane').style.zIndex = 350;

    map.createPane('citiesPane');
    map.getPane('citiesPane').style.zIndex = 450;

    map.createPane('specialCitiesPane');
    map.getPane('specialCitiesPane').style.zIndex = 500;

    const railwayLayerGroup = L.layerGroup();
    const provinceLabelsGroup = L.layerGroup().addTo(map);

    L.control.layers(null, { "🚂 Eisenbahnnetz (1900)": railwayLayerGroup }, { collapsed: false }).addTo(map);

    map.on('overlayadd', function(e) {
        if (e.layer === railwayLayerGroup) {
            // Provinzen & Gouvernements ausblenden
            if (map.hasLayer(provinceLabelsGroup)) {
                map.removeLayer(provinceLabelsGroup);
            }
            // Halo für Imperien aktivieren
            document.querySelectorAll('.empire-label').forEach(el => {
                el.classList.add('active-railway-bg');
            });
        }
    });

    map.on('overlayremove', function(e) {
        if (e.layer === railwayLayerGroup) {
            // Provinzen & Gouvernements wieder einblenden
            if (!map.hasLayer(provinceLabelsGroup)) {
                map.addLayer(provinceLabelsGroup);
            }
            // Halo für Imperien entfernen
            document.querySelectorAll('.empire-label').forEach(el => {
                el.classList.remove('active-railway-bg');
            });
        }
    });

    function getLatinName(properties) {
        if (!properties) return "";
        let name = properties["name:de"] || properties["name:en"] || properties["name:latin"] || properties.NAME || properties.name || "";
        if (/[\u0400-\u04FF]/.test(name)) {
            if (properties["name:de"]) name = properties["name:de"];
            else if (properties["name:en"]) name = properties["name:en"];
        }
        return name.replace(/Gouvernement|Guberniya|Губерния/gi, "Gouv.").trim();
    }

    document.addEventListener('DOMContentLoaded', function() {

        // Data-Fetches
        const fetchEurope    = fetch('europa_1900.geojson').then(r => r.json()).catch(() => null);
        const fetchGermany   = fetch('Deutsches-Kaiserreich_1914.json').then(r => r.json());
        const fetchAustria   = fetch('Oesterreich-1908.json').then(r => r.json());
        const fetchRussia    = fetch('Russland_1914_perfekt.geojson').then(r => r.json());

        const fetchBoehmen   = fetch('Boehmen.json').then(r => r.json());
        const fetchMaehren   = fetch('Maehren.json').then(r => r.json());
        const fetchSchlesien = fetch('Schlesien.json').then(r => r.json());
        const fetchUngarn    = fetch('Ungarn.json').then(r => r.json());
        const fetchAdmin     = fetch('Admin-1900-geojson.geojson').then(r => r.json());
        // Eisenbahn-Linien mit exaktem Dateinamen laden
        const fetchRailways  = fetch('Eisenbahn-Linien.geojson')
            .then(r => r.json())
            .catch(err => {
                console.error("Fehler beim Laden von Eisenbahn-Linien.geojson:", err);
                return null;
            });
      // 1. Manuell platzierbare Regionen-Labels (Koordinaten hier anpassen!)
        const regionData = [
            { name: "Provinz Posen", coords: [52.08, 16.8], className: 'region-label-auto' },
            { name: "Provinz Schlesien", coords: [50.78, 17.06], className: 'region-label-auto' },
            { name: "Königreich Galizien und Lodomerien", coords: [49.25, 23.2], className: 'region-label-auto' },
            { name: "Königreich Polen", coords: [52.51, 21.20], className: 'region-label-poland' }
        ];

        regionData.forEach(reg => {
            provinceLabelsGroup.addLayer(L.marker(reg.coords, {
                pane: 'specialCitiesPane',
                icon: L.divIcon({
                    className: reg.className,
                    html: reg.name,
                    iconSize: [220, 25],
                    iconAnchor: [110, 12]
                }),
                interactive: false
            }));
        });

        // 2. Data-Fetches & Render-Logik
        const excludedEmpires = [
            "Germany (Prussia)",
            "Austria-Hungary",
            "Russia (Soviet Union)"
        ];

Promise.all([
            fetchEurope, fetchGermany, fetchAustria, fetchRussia,
            fetchBoehmen, fetchMaehren, fetchSchlesien, fetchUngarn, fetchAdmin, fetchRailways
        ])
        // FIX 1: "railwayData" als 10. Argument hinzugefügt
        .then(([europeData, germanyData, austriaData, russiaData, boehmenData, maehrenData, schlesienData, ungarnData, adminData, railwayData]) => {
            
// Klassisches historisches Gleismuster (Schwarz-Weiß gestreift)
            if (railwayData) {
                // 1. Untere Ebene: Durchgehende dunkle Basislinie
                const railwayBaseLayer = L.geoJSON(railwayData, {
                    pane: 'railwaysPane',
                    style: {
                        color: '#2c3e50',   // Dunkler Schieferton
                        weight: 3.0,        // Gesamtbreite der Schiene
                        opacity: 0.95,
                        lineCap: 'butt',
                        lineJoin: 'miter'
                    }
                });

                // 2. Obere Ebene: Gestrichelte Linie in deiner Karten-Papierfarbe
                const railwayTrackLayer = L.geoJSON(railwayData, {
                    pane: 'railwaysPane',
                    style: {
                        color: '#f4f1ea',   // Matcht exakt deine Papierfarbe (#f4f1ea)
                        weight: 1.4,        // Schmaler als die Basis, erzeugt dunkle Ränder
                        opacity: 1.0,
                        dashArray: '5, 5',  // Erzeugt die klassische Gleis-Optik
                        lineCap: 'butt'
                    }
                });

                railwayLayerGroup.addLayer(railwayBaseLayer);
                railwayLayerGroup.addLayer(railwayTrackLayer);
            }
            // A. Europa-Karte laden (ohne die drei Imperien)
            if (europeData) {
                L.geoJSON(europeData, {
                    pane: 'empiresPane',
                    filter: function(feature) {
                        if (!feature.properties) return true;
                        const cName = feature.properties.country_name;
                        return !excludedEmpires.includes(cName);
                    },
                    style: { fill: true, fillColor: '#dcd6cd', fillOpacity: 0.12, stroke: true, color: '#7f8c8d', weight: 1 }
                }).addTo(map);
            }

            // B. Die 3 Großreiche mit eigenen Shapefiles/Farben laden
            L.geoJSON(germanyData, {
                pane: 'empiresPane',
                style: { fill: true, fillColor: '#1e2b37', fillOpacity: 0.18, stroke: true, color: '#1e2b37', weight: 2 }
            }).addTo(map);

            L.geoJSON(austriaData, {
                pane: 'empiresPane',
                style: { fill: true, fillColor: '#b9770e', fillOpacity: 0.18, stroke: true, color: '#b9770e', weight: 2 }
            }).addTo(map);

            L.geoJSON(russiaData, {
                pane: 'empiresPane',
                style: { fill: true, fillColor: '#922b21', fillOpacity: 0.18, stroke: true, color: '#922b21', weight: 2 }
            }).addTo(map);

            // C. Binnengrenzen (nur gestrichelt)
            const subBorderStyle = {
                fill: false,
                stroke: true,
                color: '#34495e',
                weight: 1.0,
                opacity: 0.5,
                dashArray: '2, 5'
            };

            L.geoJSON(boehmenData,   { pane: 'subbordersPane', style: subBorderStyle }).addTo(map);
            L.geoJSON(maehrenData,   { pane: 'subbordersPane', style: subBorderStyle }).addTo(map);
            L.geoJSON(schlesienData, { pane: 'subbordersPane', style: subBorderStyle }).addTo(map);
            L.geoJSON(ungarnData,    { pane: 'subbordersPane', style: subBorderStyle }).addTo(map);

           // Admin-Ebenen / Gouvernements (mit robusterem Ausschluss für die manuell gesetzten Labels)
            L.geoJSON(adminData, {
                pane: 'subbordersPane',
                style: subBorderStyle,
                onEachFeature: function(feature, layer) {
                    const name = getLatinName(feature.properties);
                    const nameLower = name.toLowerCase();
                    const rawProps = JSON.stringify(feature.properties || {}).toLowerCase();
                    
                    // Polnische Gouvernements filtern
                    const isPolishGov = rawProps.includes("suwalki") || rawProps.includes("warschau") || 
                                        rawProps.includes("kalisch") || rawProps.includes("kielce") || 
                                        rawProps.includes("lublin") || rawProps.includes("lomza") || 
                                        rawProps.includes("radom") || rawProps.includes("siedlce") || 
                                        rawProps.includes("piotrkow") || rawProps.includes("plock");

                    // Abgleich über alle gängigen Schreibweisen (DE, EN, PL, LA)
                    const isManualLabel = nameLower.includes("posen") || nameLower.includes("pozna") ||
                                          nameLower.includes("schlesien") || nameLower.includes("silesia") || nameLower.includes("śląsk") ||
                                          nameLower.includes("galizien") || nameLower.includes("galicia") || nameLower.includes("galicja") ||
                                          rawProps.includes("posen") || rawProps.includes("pozna") ||
                                          rawProps.includes("schlesien") || rawProps.includes("silesia") ||
                                          rawProps.includes("galizien") || rawProps.includes("galicia");

                    if (!isPolishGov && !isManualLabel && name) {
                        if (layer.getBounds) {
                            const labelMarker = L.marker(layer.getBounds().getCenter(), {
                                pane: 'specialCitiesPane',
                                icon: L.divIcon({
                                    className: 'region-label-auto',
                                    html: name,
                                    iconSize: [180, 20],
                                    iconAnchor: [90, 10]
                                }),
                                interactive: false
                            });
                            provinceLabelsGroup.addLayer(labelMarker);
                        }
                    }
                }
            }).addTo(map);
        })
        .catch(err => console.error("Fehler beim Laden der GeoJSON-Dateien:", err));

        // Imperien-Labels (Russland wieder etwas höher gesetzt)
        const empireData = [
            { name: "Deutsches Kaiserreich", coords: [51.7, 15.8] },
            { name: "Russländisches Reich", coords: [51.5, 22.7] },
            { name: "Österreich-Ungarn", coords: [49.5, 19.6] }
        ];

        empireData.forEach(emp => {
            L.marker(emp.coords, {
                pane: 'specialCitiesPane',
                icon: L.divIcon({
                    className: 'empire-label',
                    html: emp.name,
                    iconSize: [220, 20],
                    iconAnchor: [110, 10]
                }),
                interactive: false
            }).addTo(map);
        });

        // Städte & Sonderposition für Krakau
        const markerColor = "#2c3e50";
        const specialCities = ["Posen", "Warschau", "Lemberg"];

        const starIcon = L.divIcon({
            pane: 'specialCitiesPane',
            html: `<svg height="18" width="18" viewBox="0 0 24 24">
                     <polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" 
                              fill="${markerColor}" stroke="#ffffff" stroke-width="1.5"/>
                   </svg>`,
            className: '',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        function addCityToMap(name, lat, lng) {

            if (specialCities.includes(name)) {
                L.marker([lat, lng], { icon: starIcon, zIndexOffset: 1000 })
                 .bindTooltip(name, { permanent: true, direction: 'right', offset: [10, 0], className: 'city-label-special' })
                 .addTo(map);
            } else {
                L.circleMarker([lat, lng], {
                    pane: 'citiesPane',
                    radius: 3.5,
                    fillColor: markerColor,
                    color: "#ffffff",
                    weight: 1,
                    fillOpacity: 0.9
                })
                .bindTooltip(name, { permanent: true, direction: 'right', offset: [6, 0], className: 'city-label' })
                .addTo(map);
            }
        }

        // Städte laden
        fetch('cities-geo')
            .then(res => res.text())
            .then(textData => {
                try {
                    const geojson = JSON.parse(textData);
                    if (geojson.type || geojson.features) {
                        L.geoJSON(geojson, {
                            onEachFeature: (f) => {
                                if (f.geometry && f.geometry.coordinates) {
                                    addCityToMap(f.properties.name || f.properties.NAME || "Stadt", f.geometry.coordinates[1], f.geometry.coordinates[0]);
                                }
                            }
                        });
                        return;
                    }
                } catch (e) {}

                Papa.parse(textData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        results.data.forEach(row => {
                            let name = 'Stadt', lat = null, lng = null;
                            Object.keys(row).forEach(k => {
                                const ck = k.trim().toLowerCase();
                                if (ck === 'name' || ck === 'stadt') name = row[k].trim();
                                if (ck === 'lat' || ck === 'latitude') lat = parseFloat(String(row[k]).replace(',', '.'));
                                if (ck === 'lng' || ck === 'longitude' || ck === 'long') lng = parseFloat(String(row[k]).replace(',', '.'));
                            });
                            if (lat && lng && !isNaN(lat) && !isNaN(lng)) addCityToMap(name, lat, lng);
                        });
                    }
                });
            })
            .catch(err => console.error("Fehler beim Laden der Städte:", err));
    });
</script>

</body>
</html>
