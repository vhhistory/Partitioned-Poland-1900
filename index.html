<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa um 1900 - OpenHistoricalMap Base</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- PapaParse für CSV-Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
   <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #map {
        width: 100vw;
        height: 100vh;
        background-color: #f4f1ea;
    }

    /* Tooltip-Resets */
    .leaflet-tooltip,
    .leaflet-tooltip-pane .leaflet-tooltip {
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
    }

    .leaflet-tooltip-pane .leaflet-tooltip::before {
        display: none !important;
    }

    /* Städtenamen */
    .city-label {
        font-weight: 500;
        font-size: 11px;
        color: #333333;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9), -1px -1px 2px rgba(255, 255, 255, 0.9);
        white-space: nowrap;
    }

    .city-label-special {
        font-weight: 700;
        font-size: 12px;
        color: #111111;
        letter-spacing: 0.2px;
        text-shadow: 1px 1px 3px #ffffff, -1px -1px 3px #ffffff;
        white-space: nowrap;
    }

    /* Imperien-Beschriftungen (Dezenter & leicht transparent eingefärbt) */
    .empire-label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.9), -1px -1px 3px rgba(255, 255, 255, 0.9);
        pointer-events: none;
        white-space: nowrap;
    }

    /* Spezifische dezente Tönungen für die Reiche */
    .empire-german { color: rgba(44, 62, 80, 0.55); }      /* Preußen/Deutsches Reich: Blau-Grau */
    .empire-russian { color: rgba(144, 44, 30, 0.55); }     /* Russisches Reich: Muted Rot */
    .empire-austrian { color: rgba(180, 125, 20, 0.6); }    /* Österreich-Ungarn: Ochser-Gelb */

    /* Regionen-Namen (Provinzen/Gouvernements: Sehr dezent) */
    .region-label-auto {
        font-size: 10px;
        font-weight: 500;
        color: rgba(60, 60, 60, 0.35);
        text-transform: capitalize;
        letter-spacing: 0.2px;
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8), -1px -1px 2px rgba(255, 255, 255, 0.8);
    }
</style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Karte initialisieren
    var map = L.map('map').setView([51.8, 19.5], 6);

    // 2. Panes für Z-Index Ebenensteuerung
    map.createPane('bordersPane');
    map.getPane('bordersPane').style.zIndex = 350;

    map.createPane('citiesPane');
    map.getPane('citiesPane').style.zIndex = 450;

    map.createPane('specialCitiesPane');
    map.getPane('specialCitiesPane').style.zIndex = 500;

    // 3. OpenHistoricalMap (OHM) Tile-Layer als echtes Fundament (1900)
   // 3a. Helle Hintergrundkarte als Fallback (damit nie ein blauer/leerer Bildschirm erscheint)
// Basemap ohne störende moderne Grenzen/Labels
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>'
}).addTo(map);

// 3b. OpenHistoricalMap (OHM) Hauptkarte für das Jahr 1900
L.tileLayer('https://tile.openhistoricalmap.org/mapnik/{z}/{x}/{y}.png?datetime=1900-01-01T00:00:00Z', {
    maxZoom: 18,
    minZoom: 3,
    opacity: 1.0,
    attribution: '&copy; <a href="https://www.openhistoricalmap.org/">OpenHistoricalMap</a> contributors'
}).addTo(map);

    // Beschriftung für das Gouvernement Radom an zentraler Position setzen
L.marker([51.402, 21.147], {
    pane: 'specialCitiesPane', // Nutzen der bestehenden oberen Z-Index-Ebene
    icon: L.divIcon({
        className: 'region-label',
        html: 'Gouvernement Radom',
        iconSize: [160, 20],
        iconAnchor: [80, 10] // Zentriert den Text exakt über den Koordinaten
    }),
    interactive: false
}).addTo(map);

    // 4. Eigene GeoJSON-Grenzen (Optional – nur als dezent hervorgehobener Umriss)
    // GeoJSON aus GitHub laden & Radom ergänzen
fetch('Admin-1900-geojson.geojson')
    .then(response => response.json())
    .then(data => {
        L.geoJSON(data, {
            pane: 'bordersPane',
            style: function(feature) {
                // Sehr feine und dezent transparente Binnengrenzen
                return {
                    fill: false,
                    color: '#7f8c8d',     // Muted Grau/Brau
                    weight: 0.8,          // Sehr schlanke Linienstärke
                    opacity: 0.35,        // Hohe Transparenz
                    dashArray: '3, 3'     // Feines Strichmuster
                };
            },
            onEachFeature: function(feature, layer) {
                const name = feature.properties && feature.properties.name ? feature.properties.name : "";
                
                if (name) {
                    // Popup beim Anklicken der Grenze
                    layer.bindPopup("<b>" + name + "</b>");

                    // Berechnet das geometrische Zentrum für die dezente Beschriftung
                    if (layer.getBounds) {
                        const center = layer.getBounds().getCenter();

                        L.marker(center, {
                            pane: 'specialCitiesPane',
                            icon: L.divIcon({
                                className: 'region-label-auto',
                                html: name,
                                iconSize: [180, 20],
                                iconAnchor: [90, 10]
                            }),
                            interactive: false
                        }).addTo(map);
                    }
                }
            }
        }).addTo(map);

        // Manuelles Label für Radom (da in der GeoJSON fehlend)
        L.marker([51.402, 21.147], {
            pane: 'specialCitiesPane',
            icon: L.divIcon({
                className: 'region-label-auto',
                html: 'Gouvernement Radom',
                iconSize: [180, 20],
                iconAnchor: [90, 10]
            }),
            interactive: false
        }).addTo(map);

    })
    .catch(err => console.error("Fehler beim Laden:", err));

    // 5. Imperien-Labels an den gewünschten Positionen
    const empires = [
        { 
            name: "Deutsches Kaiserreich", 
            coords: [51.7, 16.9],  // Zwischen Posen und Breslau
            anchor: [100, 10]
        },
        { 
            name: "Russländisches Reich", 
            coords: [51.7, 21.8],  // Zwischen Warschau und Lublin
            anchor: [100, 10]
        },
        { 
            name: "Österreich-Ungarn", 
            coords: [49.5, 19.9],  // Unterhalb von Krakau
            anchor: [100, 10]
        }
    ];

    empires.forEach(emp => {
        L.marker(emp.coords, {
            pane: 'specialCitiesPane',
            icon: L.divIcon({
                className: 'empire-label',
                html: emp.name,
                iconSize: [200, 20],
                iconAnchor: emp.anchor
            }),
            interactive: false
        }).addTo(map);
    });

    // 6. Städte rendern (Einheitliche Farbe)
    const markerColor = "#2c3e50";
    const specialCities = ["Posen", "Warschau", "Lemberg"];

    // Stern-Icon für Posen, Warschau & Lemberg
    const starIcon = L.divIcon({
        pane: 'specialCitiesPane',
        html: `<svg height="18" width="18" viewBox="0 0 24 24" style="display: block;">
                 <polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" 
                          fill="${markerColor}" stroke="#ffffff" stroke-width="1.5"/>
               </svg>`,
        className: '',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
    });

    function addCityToMap(name, lat, lng) {
        const isSpecial = specialCities.includes(name);

        if (isSpecial) {
            // Fokusstadt als Stern
            const marker = L.marker([lat, lng], { 
                icon: starIcon,
                zIndexOffset: 1000 
            });

            marker.bindTooltip(name, {
                permanent: true,
                direction: 'right',
                offset: [10, 0],
                className: 'city-label-special'
            });
            marker.addTo(map);
        } else {
            // Normale Stadt als Kreis
            const marker = L.circleMarker([lat, lng], {
                pane: 'citiesPane',
                radius: 3.5,
                fillColor: markerColor,
                color: "#ffffff",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.9
            });

            marker.bindTooltip(name, {
                permanent: true,
                direction: 'right',
                offset: [6, 0],
                className: 'city-label'
            });
            marker.addTo(map);
        }
    }

    // 7. Laden der Datei 'cities-geo'
    fetch('cities-geo')
        .then(response => response.text())
        .then(textData => {
            let parsedAsGeoJSON = false;

            try {
                const geojsonData = JSON.parse(textData);
                if (geojsonData.type || geojsonData.features) {
                    parsedAsGeoJSON = true;
                    L.geoJSON(geojsonData, {
                        onEachFeature: function(feature, layer) {
                            if (feature.geometry && feature.geometry.coordinates) {
                                const lng = feature.geometry.coordinates[0];
                                const lat = feature.geometry.coordinates[1];
                                const name = feature.properties.name || feature.properties.NAME || "Stadt";
                                addCityToMap(name, lat, lng);
                            }
                        }
                    });
                }
            } catch (e) {}

            if (!parsedAsGeoJSON) {
                Papa.parse(textData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        results.data.forEach(row => {
                            let name = 'Stadt';
                            let lat = null;
                            let lng = null;

                            Object.keys(row).forEach(key => {
                                const cleanKey = key.trim().toLowerCase();
                                if (cleanKey === 'name' || cleanKey === 'stadt') name = row[key].trim();
                                if (cleanKey === 'lat' || cleanKey === 'latitude') lat = parseFloat(String(row[key]).replace(',', '.').trim());
                                if (cleanKey === 'lng' || cleanKey === 'longitude' || cleanKey === 'long') lng = parseFloat(String(row[key]).replace(',', '.').trim());
                            });

                            if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
                                addCityToMap(name, lat, lng);
                            }
                        });
                    }
                });
            }
        })
        .catch(err => console.error("Fehler beim Laden der Datei 'cities-geo':", err));
</script>

</body>
</html>
